<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espaço Holístico &amp; Terapias</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Ubuntu', sans-serif; }
    body {background: linear-gradient(135deg, #2e1065 0%, #581c87 35%, #831843 70%, #9f1239 100%); background-attachment: fixed; color: #1a1a1a; min-height: 100vh; overflow-x: hidden; padding-bottom: 115px; position: relative; }

    /* BRILHO DE LUZ AERO DE FUNDO */
    body::before {content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 18% 18%, rgba(255,255,255,0.42) 0%, transparent 45%), radial-gradient(circle at 82% 78%, rgba(244,114,182,0.28) 0%, transparent 50%), radial-gradient(circle at 50% 100%, rgba(255,255,255,0.14) 0%, transparent 60%); z-index: -1; pointer-events: none; }

    header {text-align: center; padding: 50px 20px 20px 20px; }
    header h1 {font-family: 'Cinzel', serif; font-size: 3rem; margin-bottom: 10px; color: #ffffff; text-shadow: 0 2px 8px rgba(50, 0, 50, 0.7), 0 0 25px rgba(244, 114, 182, 0.8); letter-spacing: 2px; }
    header p {font-size: 1.15rem; color: #fce7f3; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }

    /* BARRINHA DE VIDRO SUPERIOR PARA ABAS COM REFLEXO */
    .glass-tabs-bar {display: inline-flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 18px auto 8px auto; padding: 10px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.28); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 2px solid rgba(255, 255, 255, 0.85); box-shadow: 0 14px 28px rgba(25, 8, 50, 0.35), inset 0 2px 5px rgba(255,255,255,0.95), inset 0 -3px 8px rgba(88, 28, 135, 0.2); position: relative; overflow: hidden; z-index: 2; }
    .glass-tabs-bar::before {content: ''; position: absolute; top: 0; left: 4%; right: 4%; height: 48%; background: linear-gradient(180deg, rgba(255,255,255,0.68) 0%, rgba(255,255,255,0.08) 100%); border-radius: 999px 999px 60% 60%; pointer-events: none; }

    .tab-btn {padding: 10px 24px; border-radius: 999px; border: 2px solid rgba(255, 255, 255, 0.92); background: linear-gradient(180deg, rgba(255, 255, 255, 0.82) 0%, rgba(252, 231, 243, 0.45) 100%); color: #3b0764; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 6px 14px rgba(25, 8, 50, 0.22), inset 0 2px 4px rgba(255,255,255,0.95), inset 0 -3px 6px rgba(131, 24, 67, 0.16); transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; z-index: 1; }
    .tab-btn::before {content: ''; position: absolute; top: 1px; left: 10%; right: 10%; height: 46%; background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.08) 100%); border-radius: 20px 20px 50% 50%; pointer-events: none; }
    .tab-btn:hover {transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 22px rgba(244, 114, 182, 0.48), inset 0 2px 5px rgba(255,255,255,1); }
    .tab-btn.active {background: linear-gradient(180deg, #f472b6 0%, #db2777 52%, #9d174d 100%); color: #ffffff; border-color: #ffffff; text-shadow: 0 1px 2px rgba(45, 5, 65, 0.65); box-shadow: 0 10px 24px rgba(219, 39, 119, 0.55), inset 0 2px 5px rgba(255,255,255,0.9), inset 0 -3px 7px rgba(45, 5, 65, 0.35); }

    .tab-panel {display: none; }
    .tab-panel.active {display: block; animation: tabFadeIn 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes tabFadeIn {from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .container {max-width: 1050px; margin: 0 auto; padding: 20px; }

    /* JANELAS COM ESTILO VIDRO LÚCIDO (AERO GLASS + ESQUEUOMORFISMO) */
    .aero-window {background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 18px; padding: 35px; box-shadow: 0 18px 38px rgba(40, 0, 40, 0.34), 0 4px 10px rgba(255, 255, 255, 0.2), inset 0 2px 6px rgba(255, 255, 255, 0.96), inset 0 -4px 12px rgba(88, 28, 135, 0.18); margin-bottom: 42px; position: relative; overflow: hidden; }
    .aero-window::before {content: ''; position: absolute; top: 0; left: -10%; right: -10%; height: 52%; background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.16) 70%, transparent 100%); border-radius: 50% 50% 40% 40% / 18% 18% 45% 45%; pointer-events: none; }

    /* BARRINHA DE VIDRO DECORATIVA COM REFLEXO DE LUZ */
    .glass-shine-bar {height: 12px; width: 100%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(252,231,243,0.42) 55%, rgba(255,255,255,0.18) 100%); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 6px 16px rgba(255,255,255,0.22), inset 0 1px 2px #ffffff; margin: 14px auto 24px auto; position: relative; z-index: 1; }

    .aero-window h2 {font-family: 'Cinzel', serif; color: #0c4a6e; font-size: 1.8rem; margin-bottom: 12px; text-align: center; text-shadow: 0 1px 2px rgba(255,255,255,0.8); position: relative; z-index: 1; }
    .aero-window > p {text-align: center; color: #1e3a8a; margin-bottom: 22px; font-size: 1.05rem; font-weight: 500; position: relative; z-index: 1; }

    /* CARDS FRUTIGER AERO COM REFLEXO ESQUEUOMÓRFICO E REFLEXO NO CHÃO */
    .services-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 26px; position: relative; z-index: 1; }
    .card {background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(240, 253, 250, 0.74) 52%, rgba(220, 252, 231, 0.66) 100%); padding: 25px; border-radius: 15px; border: 2px solid rgba(255, 255, 255, 0.96); box-shadow: 0 10px 22px rgba(30, 10, 60, 0.22), 0 2px 4px rgba(255, 255, 255, 0.65), inset 0 2px 5px rgba(255, 255, 255, 1), inset 0 -4px 10px rgba(2, 132, 199, 0.14); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: visible; }
    .card::before {content: ''; position: absolute; top: 0; left: 0; right: 0; height: 46%; background: linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.12) 100%); border-radius: 13px 13px 60% 60% / 14px 14px 30% 30%; pointer-events: none; }
    /* REFLEXO NO CHÃO DO CARD */
    .card::after {content: ''; position: absolute; left: 6%; right: 6%; bottom: -16px; height: 14px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.42) 0%, rgba(244,114,182,0.14) 55%, transparent 100%); filter: blur(3px); pointer-events: none; transition: all 0.3s ease; }
    .card:hover {transform: translateY(-6px) scale(1.03); background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(224, 242, 254, 0.88) 55%, rgba(187, 247, 208, 0.84) 100%); border-color: #ffffff; box-shadow: 0 16px 32px rgba(2, 132, 199, 0.32), 0 0 18px rgba(255, 255, 255, 0.55), inset 0 2px 6px rgba(255, 255, 255, 1), inset 0 -4px 10px rgba(2, 132, 199, 0.22); }
    .card:hover::after {bottom: -20px; background: linear-gradient(180deg, rgba(255,255,255,0.58) 0%, rgba(244,114,182,0.22) 60%, transparent 100%); }
    .card h3 {font-family: 'Cinzel', serif; color: #0369a1; margin-bottom: 10px; font-size: 1.2rem; position: relative; z-index: 1; }
    .card p {color: #334155; font-size: 0.95rem; text-align: left; line-height: 1.5; font-weight: 400; position: relative; z-index: 1; }

    /* GALERIA DA ABA INTUIDANSE COM REFLEXO DE CHÃO */
    .gallery-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 30px; position: relative; z-index: 1; padding-bottom: 14px; }
    .photo-frame {background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(252, 231, 243, 0.74) 100%); border: 2px solid rgba(255, 255, 255, 0.96); border-radius: 16px; padding: 10px; box-shadow: 0 12px 24px rgba(25, 8, 50, 0.28), inset 0 2px 5px rgba(255,255,255,1), inset 0 -3px 8px rgba(131, 24, 67, 0.16); transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.28s ease; position: relative; overflow: visible; cursor: pointer; }
    .photo-frame::before {content: ''; position: absolute; top: 10px; left: 10px; right: 10px; height: 92px; background: linear-gradient(180deg, rgba(255,255,255,0.52) 0%, rgba(255,255,255,0.04) 100%); border-radius: 11px 11px 55% 55% / 11px 11px 28% 28%; pointer-events: none; z-index: 2; }
    /* REFLEXO NO CHÃO SOB CADA FOTO */
    .photo-frame::after {content: ''; position: absolute; left: 8%; right: 8%; bottom: -18px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(244,114,182,0.18) 55%, transparent 100%); filter: blur(3px); pointer-events: none; transition: all 0.28s ease; }
    .photo-frame:hover {transform: translateY(-6px) scale(1.02); box-shadow: 0 16px 32px rgba(244, 114, 182, 0.45), inset 0 2px 6px rgba(255,255,255,1); }
    .photo-frame:hover::after {bottom: -22px; background: linear-gradient(180deg, rgba(255,255,255,0.62) 0%, rgba(244,114,182,0.26) 60%, transparent 100%); }
    .photo-frame img {width: 100%; height: 260px; object-fit: cover; border-radius: 11px; display: block; border: 1px solid rgba(255, 255, 255, 0.85); }
    .photo-caption {margin-top: 8px; font-size: 0.85rem; color: #3b0764; font-weight: 600; text-align: center; position: relative; z-index: 1; }

    /* LIGHTBOX PARA AMPLIAR FOTO */
    .lightbox {position: fixed; inset: 0; background: rgba(20, 5, 38, 0.82); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 20000; }
    .lightbox.open {display: flex; }
    .lightbox-box {max-width: 780px; width: 100%; background: rgba(255, 255, 255, 0.92); border: 2px solid #ffffff; border-radius: 18px; padding: 14px; box-shadow: 0 24px 50px rgba(0, 0, 0, 0.6), inset 0 2px 6px #ffffff; text-align: center; position: relative; }
    .lightbox-box img {max-height: 75vh; max-width: 100%; width: auto; border-radius: 12px; display: block; margin: 0 auto; }
    .lightbox-close {margin-top: 12px; padding: 9px 22px; border-radius: 999px; border: 2px solid #ffffff; background: linear-gradient(180deg, #f472b6 0%, #db2777 100%); color: #ffffff; font-weight: 700; cursor: pointer; box-shadow: 0 6px 14px rgba(219, 39, 119, 0.4); }

    .spotify-container {margin-top: 16px; border-radius: 14px; overflow: hidden; border: 3px solid rgba(255, 255, 255, 0.88); box-shadow: 0 12px 26px rgba(25, 8, 50, 0.32), inset 0 1px 3px rgba(255,255,255,0.85); position: relative; z-index: 1; }

    /* SEÇÃO DE CONTATOS ESTILO WIDGET AERO + REFLEXO NO CHÃO */
    .cta-section {text-align: center; background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 40px 20px; border-radius: 18px; border: 2px solid rgba(255, 255, 255, 0.8); box-shadow: 0 18px 38px rgba(40, 0, 40, 0.34), inset 0 2px 6px rgba(255, 255, 255, 0.96), inset 0 -4px 12px rgba(88, 28, 135, 0.18); position: relative; overflow: visible; }
    .cta-section::before {content: ''; position: absolute; top: 0; left: -10%; right: -10%; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.54) 0%, rgba(255,255,255,0.12) 75%, transparent 100%); border-radius: 50% 50% 40% 40% / 18% 18% 45% 45%; pointer-events: none; }
    .cta-section::after {content: ''; position: absolute; left: 8%; right: 8%; bottom: -20px; height: 18px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.36) 0%, rgba(244,114,182,0.15) 60%, transparent 100%); filter: blur(4px); pointer-events: none; }
    .cta-section h2 {font-family: 'Cinzel', serif; color: #0c4a6e; margin-bottom: 10px; font-size: 1.8rem; position: relative; z-index: 1; }
    .cta-section p {margin-bottom: 25px; color: #1e3a8a; font-size: 1.05rem; font-weight: 500; position: relative; z-index: 1; }
    .btn-portal {display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; font-size: 1.05rem; font-weight: 700; text-decoration: none; border-radius: 30px; margin: 8px; border: 2px solid rgba(255, 255, 255, 0.95); transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 8px 20px rgba(25, 8, 50, 0.25), inset 0 2px 5px rgba(255,255,255,0.85), inset 0 -4px 8px rgba(0,0,0,0.18); position: relative; overflow: hidden; z-index: 1; }
    .btn-portal::before {content: ''; position: absolute; top: 1px; left: 8%; right: 8%; height: 48%; background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.08) 100%); border-radius: 24px 24px 50% 50%; pointer-events: none; }
    .btn-portal:active {transform: translateY(2px) scale(0.98); box-shadow: 0 3px 10px rgba(25, 8, 50, 0.25), inset 0 3px 8px rgba(0,0,0,0.28); }
    .btn-whatsapp {background: linear-gradient(180deg, #4ade80 0%, #22c55e 48%, #15803d 100%); color: white; text-shadow: 0 1px 2px rgba(0, 60, 20, 0.6); }
    .btn-whatsapp:hover {transform: translateY(-2px) scale(1.06); box-shadow: 0 12px 26px rgba(34, 197, 94, 0.55), inset 0 2px 6px rgba(255,255,255,0.95); }
    .btn-insta1 {background: linear-gradient(135deg, #fb923c 0%, #ec4899 52%, #7c3aed 100%); color: white; text-shadow: 0 1px 2px rgba(45, 5, 65, 0.65); }
    .btn-insta1:hover {transform: translateY(-2px) scale(1.06); box-shadow: 0 12px 26px rgba(219, 39, 119, 0.55), inset 0 2px 6px rgba(255,255,255,0.95); }

    /* BARRA INFERIOR APENAS COM O BOTÃO DO MENU */
    .windows-taskbar {position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: linear-gradient(180deg, rgba(126, 34, 206, 0.72) 0%, rgba(88, 28, 135, 0.92) 45%, rgba(46, 16, 101, 0.98) 100%); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-top: 2px solid rgba(255, 255, 255, 0.72); box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.45), inset 0 2px 4px rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: flex-start; padding: 0 20px; z-index: 9999; }
    .start-btn-container {position: relative; }
    .orb-button {width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 32% 25%, #ffffff 0%, #f9a8d4 24%, #db2777 62%, #581c87 100%); border: 2px solid rgba(255, 255, 255, 0.98); box-shadow: 0 0 16px rgba(244, 114, 182, 0.95), 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 2px 8px rgba(255, 255, 255, 0.95), inset 0 -4px 8px rgba(46, 16, 101, 0.65); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease; }
    .orb-button:hover {transform: scale(1.12); box-shadow: 0 0 24px rgba(255, 255, 255, 1), 0 0 36px rgba(244, 114, 182, 0.9); }
    .orb-button:active {transform: scale(0.95); }
    .orb-spiral {width: 26px; height: 26px; border: 3px dashed rgba(255, 255, 255, 0.95); border-radius: 50%; border-top-color: #fbcfe8; border-left-color: #ffffff; animation: spin 6s linear infinite; }
    @keyframes spin {0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* MENU ESPIRITUAL COM ANIMAÇÃO DE ABERTURA ELÁSTICA */
    .windows-menu {position: absolute; bottom: 76px; left: 0; width: 300px; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 2px solid rgba(255, 255, 255, 0.96); border-radius: 16px; box-shadow: 0 18px 42px rgba(25, 8, 50, 0.45), inset 0 2px 6px rgba(255,255,255,1), inset 0 -4px 10px rgba(131, 24, 67, 0.14); padding: 16px; transform-origin: bottom left; opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(22px) scale(0.76); filter: blur(4px); transition: transform 0.42s cubic-bezier(0.22, 1.35, 0.36, 1), opacity 0.28s ease, filter 0.32s ease, visibility 0s linear 0.42s; z-index: 10000; }
    .windows-menu.show {opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0) scale(1); filter: blur(0); transition: transform 0.42s cubic-bezier(0.22, 1.35, 0.36, 1), opacity 0.25s ease, filter 0.28s ease, visibility 0s linear 0s; }
    .win7-menu-header {background: linear-gradient(180deg, #f472b6 0%, #db2777 55%, #be185d 100%); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 10px; padding: 10px; margin-bottom: 12px; text-align: center; box-shadow: 0 4px 10px rgba(190, 24, 93, 0.3), inset 0 2px 4px rgba(255,255,255,0.75); }
    .win7-menu-header h3 {font-family: 'Cinzel', serif; color: #ffffff; font-size: 1.05rem; text-shadow: 0 1px 2px rgba(0,0,0,0.35); }
    .windows-menu ul {list-style: none; }
    .windows-menu li {margin-bottom: 8px; opacity: 0; transform: translateX(-10px); transition: transform 0.28s ease, opacity 0.24s ease; }
    .windows-menu.show li {opacity: 1; transform: translateX(0); }
    .windows-menu.show li:nth-child(1) {transition-delay: 0.06s; }
    .windows-menu.show li:nth-child(2) {transition-delay: 0.12s; }
    .windows-menu.show li:nth-child(3) {transition-delay: 0.18s; }
    .windows-menu a, .windows-menu button.menu-tab-link {width: 100%; display: flex; align-items: center; padding: 10px 14px; color: #0f172a; text-decoration: none; background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(252, 231, 243, 0.72) 100%); border: 1px solid rgba(219, 39, 119, 0.35); border-radius: 10px; font-weight: 600; font-size: 0.95rem; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255,255,255,0.9); transition:
